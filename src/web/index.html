<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archivist · the parish archive of Wending</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-lang="en" data-screen="setup">
    <header class="mast">
      <div class="brand">
        <span class="callno">WEN · 1820–1895</span>
        <h1 data-t="brand">Archivist</h1>
        <span class="sub" data-t="brandSub"></span>
      </div>
      <dl id="gauges" class="gauges" hidden>
        <div class="gauge"><dt class="label" data-t="gaugeQuestion"></dt><dd id="qnum"></dd></div>
        <div class="gauge"><dt class="label" data-t="gaugeActions"></dt><dd><span id="pips" class="pips"></span></dd></div>
        <div class="gauge"><dt class="label" data-t="gaugePoints"></dt><dd id="points">0</dd></div>
      </dl>
      <div class="lang" role="group" data-t-aria="langLabel">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="zh" lang="zh-CN">中文</button>
      </div>
    </header>
    <p id="langnote" class="langnote" role="status" hidden></p>

    <main>
      <section id="setup" class="setup">
        <article class="accession">
          <p class="label" data-t="setupLabel"></p>
          <h2 class="accession-title" data-t="setupTitle"></h2>
          <p class="pitch" data-t="pitch"></p>
          <section class="rules">
            <h3 class="label" data-t="rulesTitle"></h3>
            <ol id="rules"></ol>
          </section>
        </article>

        <div class="ticket">
          <div class="ticket-head">
            <span class="label" data-t="ticketTitle"></span>
            <span class="callno">No. <span id="ticketno">0001</span></span>
          </div>
          <div class="ticket-fields">
            <label class="field"><span class="label" data-t="seedLabel"></span><input id="seed" type="number" min="1" data-t-ph="seedPh" /></label>
            <label class="field" id="modelbox" hidden><span class="label" data-t="researcherLabel"></span><select id="model"></select></label>
          </div>
          <fieldset class="modes">
            <legend class="label" data-t="modeLegend"></legend>
            <button type="button" id="mode-play" class="mode" data-mode="play"><span class="mode-k">A</span><strong data-t="modePlay"></strong><span class="mode-sub" data-t="modePlaySub"></span></button>
            <button type="button" id="mode-watch" class="mode" data-mode="watch"><span class="mode-k">B</span><strong data-t="modeWatch"></strong><span class="mode-sub" data-t="modeWatchSub"></span></button>
          </fieldset>
          <button type="button" id="continue" class="plain" data-t="continue" hidden></button>
          <p class="fine" data-t="ticketFine"></p>
        </div>
      </section>

      <section id="game" class="game" hidden>
        <div class="desk">
          <section class="enquiry">
            <div class="slip-head">
              <span class="label" data-t="questionHead"></span>
              <span id="qcall" class="callno"></span>
            </div>
            <p id="question" class="question"></p>
            <form id="answerform" class="answerform">
              <label class="field"><span class="label" data-t="answerLabel"></span><input id="answer" autocomplete="off" data-t-ph="answerPh" /></label>
              <fieldset id="cites" class="cites"><legend class="label" data-t="citeLegend"></legend></fieldset>
              <button id="answerbtn" class="primary" type="submit" data-t="answerBtn"></button>
              <p id="answerproblem" class="problem" role="alert"></p>
            </form>
            <div id="verdictbox" class="verdictbox" hidden></div>
            <p id="busy" class="busy" role="status" hidden></p>
            <div class="watchbar">
              <button type="button" id="step" hidden data-t="step"></button>
              <button type="button" id="auto" class="primary" hidden data-t="auto"></button>
              <button type="button" id="nextq" class="primary" hidden></button>
              <button type="button" id="quit" class="plain" data-t="quit"></button>
            </div>
          </section>

          <section class="ledger">
            <h2 class="label" data-t="ledgerHead"></h2>
            <ol id="qledger" class="qledger"></ol>
          </section>

          <section class="notebook">
            <h2 class="label"><label for="notes" data-t="notebook"></label></h2>
            <textarea id="notes" rows="5" data-t-ph="notesPh"></textarea>
          </section>
        </div>

        <div class="catalogue">
          <h2 class="label drawer-label" data-t="catalogueHead"></h2>
          <form id="searchform" class="searchform">
            <input id="query" type="search" autocomplete="off" data-t-ph="queryPh" data-t-aria="queryPh" />
            <button type="submit" data-t="searchBtn"></button>
          </form>
          <form id="openform" class="openform">
            <input id="openid" autocomplete="off" data-t-ph="openPh" data-t-aria="openPh" />
            <button type="submit" data-t="openBtn"></button>
          </form>
          <ol id="trail" class="trail"></ol>
        </div>

        <div class="reader">
          <div id="tabs" class="tabs"></div>
          <article class="sheet">
            <header class="sheet-head">
              <dl id="sheetmeta" class="sheetmeta"></dl>
              <h2 id="readertitle"></h2>
            </header>
            <div id="page" class="page"></div>
          </article>
        </div>
      </section>

      <section id="result" class="result" hidden>
        <div class="result-head">
          <div>
            <p class="label" data-t="resultLabel"></p>
            <h2 id="verdict"></h2>
          </div>
          <div id="finalstamp" class="stamp"></div>
        </div>
        <table id="tally"></table>
        <p id="compare" class="compare"></p>
        <div class="row">
          <button type="button" id="again" class="primary" data-t="again"></button>
          <button type="button" id="next" data-t="next"></button>
          <button type="button" id="back" class="plain" data-t="back"></button>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
