<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archivist · the parish archive of Wending</title>
    <link rel="icon" href="data:," />
    <style>
/* Archivist: a reading room and its card catalogue.
   Manila and paper surfaces, ink text, hairline rules in brown, one stamp red
   for stamps and the main action, a faded blue-black ink for citations. */

:root {
  --page: #efe6d2;
  --card: #f7f1e3;
  --drawer: #e4d6b8;
  --ink: #2a2620;
  --ink-2: #5e5446;
  --muted: #8a7d68;
  --rule: #c9b796;
  --rule-strong: #a8956f;
  --stamp: #a8322a;
  --stamp-faint: rgba(168, 50, 42, 0.4);
  --blue: #2f3f5a;
  --mark: #ead79f;

  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Noto Serif CJK SC', 'Source Han Serif SC', 'Songti SC', STSong, SimSun, serif;
  --mono: 'Courier Prime', 'Courier New', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;

  /* Type scale */
  --t1: 12px;
  --t2: 14px;
  --t3: 16px;
  --t4: 19px;
  --t5: 24px;
  --t6: 34px;

  /* Spacing scale */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 24px;
  --s6: 32px;
  --s7: 48px;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 400 var(--t3) / 1.5 var(--sans);
  min-height: 100vh;
}

[hidden] {
  display: none !important;
}

h1,
h2,
h3,
p {
  margin: 0;
}

:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}

/* ---- the small typewritten labels -------------------------------------- */

.label {
  font: 400 var(--t1) / 1.4 var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
}

.callno {
  font: 400 var(--t1) / 1.4 var(--mono);
  letter-spacing: 0.04em;
  color: var(--blue);
  overflow-wrap: anywhere;
}

.docid {
  font: 400 var(--t1) / 1.4 var(--mono);
  color: var(--muted);
  overflow-wrap: anywhere;
}

/* Chinese labels are set in the sans, not spaced out typewriter capitals. */
body[data-lang='zh'] .label {
  font-family: var(--sans);
  letter-spacing: 0;
  text-transform: none;
  font-size: var(--t1);
}

code {
  font: var(--t2) var(--mono);
  color: var(--blue);
}

/* ---- controls ----------------------------------------------------------- */

button {
  font: 600 var(--t2) / 1.2 var(--sans);
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--ink-2);
  border-radius: 2px;
  padding: var(--s2) var(--s4);
  min-height: 36px;
  cursor: pointer;
}

button:hover:not(:disabled) {
  background: #fffaf0;
  border-color: var(--ink);
}

button:disabled {
  opacity: 0.45;
  cursor: default;
}

button.primary {
  background: var(--stamp);
  border-color: var(--stamp);
  color: var(--card);
}

button.primary:hover:not(:disabled) {
  background: #8f2a23;
  border-color: #8f2a23;
}

button.plain {
  background: none;
  border-color: transparent;
  color: var(--blue);
  text-decoration: underline;
  text-underline-offset: 3px;
  padding-left: var(--s2);
  padding-right: var(--s2);
}

button.plain:hover:not(:disabled) {
  background: none;
  border-color: transparent;
  color: var(--ink);
}

button.link {
  background: none;
  border: 0;
  padding: 0;
  min-height: 0;
  font: inherit;
  color: var(--blue);
  text-align: left;
  text-decoration: underline;
  text-decoration-color: var(--rule-strong);
  text-underline-offset: 3px;
}

input,
select,
textarea {
  font: var(--t3) / 1.4 var(--serif);
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--rule);
  border-bottom-color: var(--ink-2);
  border-radius: 0;
  padding: var(--s2) var(--s3);
  min-height: 36px;
  width: 100%;
  min-width: 0;
}

input::placeholder,
textarea::placeholder {
  color: var(--muted);
}

input:disabled {
  background: transparent;
  color: var(--muted);
}

.field {
  display: flex;
  flex-direction: column;
  gap: var(--s1);
}

/* ---- the masthead ------------------------------------------------------- */

.mast {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--s3) var(--s6);
  padding: var(--s4) var(--s5) var(--s3);
  border-bottom: 3px double var(--rule-strong);
}

.brand {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--s1) var(--s3);
  margin-right: auto;
}

.brand .callno {
  flex-basis: 100%;
  color: var(--muted);
}

.brand h1 {
  font: 600 var(--t5) / 1.1 var(--serif);
  letter-spacing: 0.01em;
}

.brand .sub {
  font: var(--t2) / 1.3 var(--serif);
  color: var(--ink-2);
}

.gauges {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2) var(--s5);
  margin: 0;
}

.gauge {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.gauge dd {
  margin: 0;
  font: 400 var(--t4) / 1.2 var(--mono);
  min-height: 23px;
  display: flex;
  align-items: center;
}

.pips {
  display: inline-flex;
  gap: 5px;
}

/* Actions left are holes still to be punched; spent ones are punched through. */
.pips span {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 1px solid var(--ink-2);
  background: var(--page);
}

.pips span.on {
  background: var(--ink);
  border-color: var(--ink);
}

.lang {
  display: inline-flex;
}

.lang button {
  font: 400 var(--t1) / 1 var(--mono);
  letter-spacing: 0.06em;
  min-height: 30px;
  padding: var(--s1) var(--s3);
  background: transparent;
  border-color: var(--rule-strong);
}

.lang button + button {
  border-left: 0;
}

.lang button[lang='zh-CN'] {
  font-family: var(--sans);
  letter-spacing: 0;
}

.lang button[aria-pressed='true'] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--card);
}

.langnote {
  padding: var(--s2) var(--s5);
  background: var(--drawer);
  border-bottom: 1px solid var(--rule);
  font-size: var(--t2);
  color: var(--ink-2);
}

main {
  max-width: 1440px;
  margin: 0 auto;
  padding: var(--s5);
}

/* ---- the start page: an accession card and a reader's ticket ------------ */

.setup {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
  gap: var(--s6);
  align-items: start;
}

.accession {
  background: var(--card);
  border: 1px solid var(--rule);
  padding: var(--s5) var(--s6) var(--s6);
  position: relative;
}

.accession > .label {
  padding-bottom: var(--s2);
  border-bottom: 1px solid var(--stamp-faint);
}

.accession-title {
  font: 400 var(--t6) / 1.15 var(--serif);
  margin: var(--s5) 0 var(--s4);
  max-width: 20ch;
}

.pitch {
  font: var(--t4) / 1.55 var(--serif);
  color: var(--ink);
  max-width: 62ch;
}

.rules {
  margin-top: var(--s6);
  border-top: 1px solid var(--rule);
  padding-top: var(--s4);
}

.rules ol {
  margin: var(--s3) 0 0;
  padding: 0;
  list-style: none;
  counter-reset: rule;
}

.rules li {
  counter-increment: rule;
  display: grid;
  grid-template-columns: 2.5em 1fr;
  padding: var(--s2) 0;
  border-bottom: 1px solid var(--rule);
  font: var(--t2) / 1.55 var(--serif);
  color: var(--ink-2);
}

.rules li::before {
  content: counter(rule, upper-roman) '.';
  font: var(--t1) / 1.9 var(--mono);
  color: var(--muted);
}

/* A punched hole, as on a catalogue card. */
.accession::after,
.hit::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 9px;
  width: 12px;
  height: 12px;
  margin-left: -6px;
  border-radius: 50%;
  border: 1px solid var(--rule);
  background: var(--page);
}

.ticket {
  background: var(--drawer);
  border: 1px solid var(--rule-strong);
  padding: var(--s4) var(--s5) var(--s5);
  display: flex;
  flex-direction: column;
  gap: var(--s4);
}

.ticket-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--s3);
  padding-bottom: var(--s2);
  border-bottom: 1px dashed var(--rule-strong);
}

.ticket-head .label {
  color: var(--stamp);
}

.ticket-fields {
  display: grid;
  gap: var(--s3);
}

.modes {
  border: 0;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--s3);
}

.modes legend {
  padding: 0;
  margin-bottom: var(--s2);
}

.mode {
  display: grid;
  grid-template-columns: 32px 1fr;
  grid-template-rows: auto auto;
  column-gap: var(--s3);
  row-gap: 2px;
  text-align: left;
  padding: var(--s3) var(--s4);
  background: var(--card);
  border: 1px solid var(--rule-strong);
  font-weight: 400;
}

.mode-k {
  grid-row: 1 / 3;
  align-self: start;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--ink-2);
  font: var(--t2) / 1 var(--mono);
  color: var(--ink-2);
}

.mode strong {
  font: 600 var(--t4) / 1.25 var(--serif);
  color: var(--ink);
}

.mode-sub {
  font: var(--t2) / 1.4 var(--sans);
  color: var(--ink-2);
}

.mode:hover:not(:disabled) .mode-k {
  background: var(--stamp);
  border-color: var(--stamp);
  color: var(--card);
}

#continue {
  align-self: flex-start;
}

.fine {
  font-size: var(--t1);
  color: var(--ink-2);
  line-height: 1.5;
}

/* ---- the reading room ---------------------------------------------------- */

.game {
  display: grid;
  grid-template-columns: minmax(290px, 0.95fr) minmax(310px, 1fr) minmax(360px, 1.3fr);
  gap: var(--s5);
  align-items: start;
}

.desk {
  display: flex;
  flex-direction: column;
  gap: var(--s5);
  min-width: 0;
}

h2.label {
  margin-bottom: var(--s2);
}

/* The enquiry is a request slip: a printed head, a tear line, and the answer below it. */
.enquiry {
  background: var(--card);
  border: 1px solid var(--rule-strong);
  padding: var(--s3) var(--s4) var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

.slip-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--s3);
  padding-bottom: var(--s2);
  border-bottom: 1px solid var(--stamp-faint);
}

.slip-head .label {
  color: var(--stamp);
}

.question {
  font: var(--t4) / 1.45 var(--serif);
}

.answerform {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  padding-top: var(--s3);
  border-top: 1px dashed var(--rule-strong);
}

.answerform .primary {
  align-self: flex-start;
}

.cites {
  border: 0;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}

.cites legend {
  padding: 0;
  margin-bottom: var(--s2);
}

.cites .none {
  font-size: var(--t2);
  color: var(--muted);
}

/* Citations are small slips; a ticked one takes the stamp's colour. */
.slip {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  padding: var(--s1) var(--s2);
  background: var(--page);
  border: 1px solid var(--rule-strong);
  cursor: pointer;
  max-width: 100%;
}

.slip input {
  width: auto;
  min-height: 0;
  margin: 0;
  accent-color: var(--stamp);
}

.slip:has(input:checked) {
  border-color: var(--stamp);
  background: var(--card);
}

.slip:has(input:checked) .callno {
  color: var(--stamp);
}

.slip.small {
  cursor: default;
  padding: 2px var(--s2);
}

.problem {
  font-size: var(--t2);
  color: var(--stamp);
  min-height: 0;
}

.problem:empty {
  display: none;
}

.verdictbox {
  padding-top: var(--s3);
  border-top: 1px dashed var(--rule-strong);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  font: var(--t2) / 1.55 var(--serif);
}

.verdict-line {
  font-size: var(--t3);
}

.verdictbox .muted {
  color: var(--ink-2);
}

.verdictbox .cited {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
}

/* A rubber stamp: a double rule, set slightly off true. */
.stamp {
  align-self: flex-start;
  display: inline-block;
  padding: var(--s1) var(--s3);
  border: 3px double currentColor;
  color: var(--stamp);
  font: 700 var(--t2) / 1.2 var(--mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  transform: rotate(-2deg);
  margin: var(--s1) 0 var(--s1) 2px;
}

.stamp.right {
  color: var(--blue);
}

.stamp.wrong {
  color: var(--ink-2);
  transform: rotate(1.5deg);
}

body[data-lang='zh'] .stamp {
  font-family: var(--serif);
  letter-spacing: 0.04em;
  font-size: var(--t3);
}

.busy {
  font: var(--t2) var(--serif);
  color: var(--blue);
}

.watchbar {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  align-items: center;
}

.watchbar #quit {
  margin-left: auto;
}

/* The question ledger: one ruled line per question. */
.qledger {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--ink-2);
}

.q-row {
  display: grid;
  grid-template-columns: 2.6em minmax(0, 1fr) auto;
  gap: var(--s2);
  align-items: baseline;
  padding: 6px 0;
  border-bottom: 1px solid var(--rule);
  font: var(--t2) / 1.4 var(--serif);
}

.q-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink-2);
}

.q-row.pending .q-text {
  color: var(--muted);
  font-family: var(--sans);
  font-size: var(--t1);
}

.q-row.pending .callno {
  color: var(--muted);
}

.q-row.here .q-text {
  color: var(--ink);
}

.q-row.here .callno {
  color: var(--stamp);
}

.q-mark {
  font: var(--t2) var(--mono);
}

.q-row.cited .q-mark {
  color: var(--stamp);
}

.q-row.right .q-mark {
  color: var(--blue);
}

.q-row.wrong .q-mark {
  color: var(--muted);
}

/* The notebook is lined paper. */
#notes {
  resize: vertical;
  line-height: 28px;
  padding-top: 0;
  background-color: var(--card);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--rule) 27px, var(--rule) 28px);
  background-attachment: local;
  border-color: var(--rule);
}

/* ---- the catalogue drawer ---------------------------------------------- */

.catalogue {
  background: var(--drawer);
  border: 1px solid var(--rule-strong);
  padding: var(--s4);
  min-width: 0;
}

/* The brass label holder on the front of a drawer. */
.drawer-label {
  display: table;
  margin: 0 auto var(--s4);
  padding: 2px var(--s4);
  border: 1px solid var(--ink-2);
  background: var(--card);
}

.searchform,
.openform {
  display: flex;
  margin-bottom: var(--s2);
}

.searchform input,
.openform input {
  flex: 1;
  border-right: 0;
}

.openform input {
  font: var(--t2) var(--mono);
}

.searchform button,
.openform button {
  flex: none;
}

.trail {
  list-style: none;
  margin: var(--s4) 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}

.trail > .none {
  font: var(--t2) / 1.5 var(--serif);
  color: var(--ink-2);
}

.search .q {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  align-items: baseline;
  margin-bottom: var(--s2);
}

.search .query {
  font: var(--t2) var(--serif);
  color: var(--ink);
  overflow-wrap: anywhere;
}

.hits {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}

.hits > .none {
  font-size: var(--t2);
  color: var(--muted);
  padding: var(--s2) 0;
}

/* A catalogue card: call number at the head, a red rule, title and the matching line. */
.hit {
  position: relative;
  background: var(--card);
  border: 1px solid var(--rule);
  padding: var(--s2) var(--s3) var(--s5);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: var(--s3);
  row-gap: var(--s1);
}

.hit .card-top {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  gap: var(--s3);
  padding-bottom: var(--s1);
  border-bottom: 1px solid var(--stamp-faint);
}

.hit .card-title {
  font: 600 var(--t3) / 1.35 var(--serif);
  grid-column: 1;
}

.hit .snip {
  grid-column: 1;
  font: var(--t2) / 1.5 var(--serif);
  color: var(--ink-2);
}

.hit button {
  grid-column: 2;
  grid-row: 2 / 4;
  align-self: center;
  min-height: 30px;
  padding: var(--s1) var(--s3);
  font-size: var(--t1);
}

.hit.read {
  background: var(--page);
}

.hit.read .card-title {
  color: var(--ink-2);
}

.hit.read button {
  border-color: var(--rule-strong);
  color: var(--ink-2);
}

.hit::after {
  background: var(--drawer);
  bottom: 7px;
  width: 9px;
  height: 9px;
  margin-left: -4.5px;
}

.opened {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  align-items: baseline;
  font: var(--t2) / 1.4 var(--serif);
}

/* The researcher's reasons, pencilled in the margin. */
.why {
  display: flex;
  gap: var(--s2);
  align-items: baseline;
  padding-left: var(--s3);
  border-left: 1px solid var(--blue);
  font: italic var(--t2) / 1.5 var(--serif);
  color: var(--blue);
}

.why span:lang(zh) {
  font-style: normal;
}

.why .by {
  flex: none;
  font-style: normal;
  color: var(--blue);
}

/* ---- the reading desk ---------------------------------------------------- */

.reader {
  min-width: 0;
  position: sticky;
  top: var(--s4);
  max-height: calc(100vh - var(--s6));
  overflow: auto;
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  padding-left: var(--s2);
}

/* Folder tabs: the open one joins the sheet below it. */
.tab {
  font: 400 var(--t1) / 1 var(--mono);
  min-height: 28px;
  padding: var(--s2) var(--s3);
  background: var(--drawer);
  border: 1px solid var(--rule);
  border-bottom: 0;
  color: var(--ink-2);
  margin-bottom: -1px;
  position: relative;
}

.tab.on {
  background: var(--card);
  border-color: var(--rule-strong);
  color: var(--ink);
  z-index: 1;
}

.sheet {
  background: var(--card);
  border: 1px solid var(--rule-strong);
  padding: var(--s5) var(--s6) var(--s6);
  min-height: 420px;
}

.sheet.empty {
  min-height: 260px;
  background: transparent;
  border-style: dashed;
}

.sheet-head {
  border-bottom: 3px double var(--rule-strong);
  padding-bottom: var(--s3);
  margin-bottom: var(--s5);
}

.sheetmeta {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, auto));
  justify-content: start;
  gap: 0;
  margin: 0 0 var(--s3);
}

.sheetmeta:empty {
  display: none;
}

.sheetmeta > div {
  padding: 0 var(--s4) 0 0;
  margin-right: var(--s4);
  border-right: 1px solid var(--rule);
}

.sheetmeta > div:last-child {
  border-right: 0;
  margin-right: 0;
}

.sheetmeta dt {
  color: var(--muted);
}

.sheetmeta dd {
  margin: 0;
  font: var(--t2) / 1.4 var(--serif);
  color: var(--ink);
}

.sheetmeta dd.callno,
.sheetmeta dd.docid {
  font: var(--t2) / 1.4 var(--mono);
}

#readertitle {
  font: 400 var(--t5) / 1.25 var(--serif);
}

.sheet.empty #readertitle {
  color: var(--muted);
}

.page {
  font: var(--t3) / 1.7 var(--serif);
  color: var(--ink);
}

.page p {
  margin: 0 0 var(--s2);
}

.page .empty {
  color: var(--muted);
  font-size: var(--t2);
}

/* Register and ledger lines hang on their year. */
.page p.entry {
  display: grid;
  grid-template-columns: 4.2em minmax(0, 1fr);
  gap: var(--s2);
  padding-bottom: var(--s1);
  border-bottom: 1px solid rgba(201, 183, 150, 0.55);
}

.page:lang(zh) p.entry {
  grid-template-columns: 5.6em minmax(0, 1fr);
}

.page .yr {
  font: var(--t2) / 1.95 var(--mono);
  color: var(--ink-2);
}

.page:lang(zh) .yr {
  font-family: var(--serif);
  font-size: var(--t3);
  line-height: 1.7;
}

/* Letters: the place and date set right, the signature too. */
.sheet[data-series='letter'] .page p:first-child,
.sheet[data-series='letter'] .page p:last-child {
  text-align: right;
}

.sheet[data-series='letter'] .page p:nth-child(2) {
  margin-top: var(--s3);
}

.sheet[data-series='letter'] .page p:last-child {
  margin-top: var(--s3);
  font-style: italic;
}

.sheet[data-series='letter'] .page:lang(zh) p:last-child {
  font-style: normal;
}

/* A gazette clipping: the headline centred over a rule. */
.sheet[data-series='gazette'] .page p:first-child {
  text-align: center;
  font-weight: 700;
  letter-spacing: 0.12em;
  padding-bottom: var(--s2);
  margin-bottom: var(--s3);
  border-bottom: 1px solid var(--ink-2);
}

.sheet[data-series='gazette'] .page:lang(zh) p:first-child {
  letter-spacing: 0.3em;
}

mark {
  background: var(--mark);
  color: inherit;
  padding: 0 1px;
}

/* ---- the results -------------------------------------------------------- */

.result {
  background: var(--card);
  border: 1px solid var(--rule-strong);
  padding: var(--s5) var(--s6) var(--s6);
  display: flex;
  flex-direction: column;
  gap: var(--s5);
}

.result-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--s4);
  padding-bottom: var(--s4);
  border-bottom: 3px double var(--rule-strong);
}

#verdict {
  font: 400 var(--t5) / 1.3 var(--serif);
  margin-top: var(--s2);
  max-width: 40ch;
}

#finalstamp {
  font-size: var(--t4);
  padding: var(--s2) var(--s4);
}

#tally {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--t2);
}

#tally th {
  text-align: left;
  font: 400 var(--t1) / 1.4 var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-2);
  padding: var(--s2) var(--s3) var(--s2) 0;
  border-bottom: 1px solid var(--ink-2);
}

body[data-lang='zh'] #tally th {
  font-family: var(--sans);
  letter-spacing: 0;
}

#tally td {
  padding: var(--s3) var(--s3) var(--s3) 0;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
}

#tally .qcell {
  font: var(--t3) / 1.45 var(--serif);
  max-width: 46ch;
}

#tally .ans {
  margin-top: var(--s1);
  font: var(--t1) / 1.4 var(--mono);
  color: var(--ink-2);
}

#tally tr.sum td {
  border-top: 3px double var(--rule-strong);
  border-bottom: 0;
  font-weight: 600;
}

.compare {
  font: var(--t4) / 1.45 var(--serif);
}

.compare:empty {
  display: none;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}

/* ---- narrower screens ---------------------------------------------------- */

@media (max-width: 1180px) {
  .game {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
  }

  .desk {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    align-items: start;
  }

  .desk .enquiry {
    grid-row: span 2;
  }
}

@media (max-width: 900px) {
  .setup {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--s5);
  }

  .accession-title {
    font-size: var(--t5);
  }
}

/* A phone: one column, the whole page scrolls, nothing scrolls inside it. */
@media (max-width: 760px) {
  main {
    padding: var(--s3);
  }

  .mast {
    padding: var(--s3);
    gap: var(--s2) var(--s4);
  }

  .langnote {
    padding: var(--s2) var(--s3);
  }

  .accession,
  .result {
    padding: var(--s4) var(--s4) var(--s5);
  }

  .pitch {
    font-size: var(--t3);
  }

  .game {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: var(--s4);
  }

  .game > *,
  .desk > * {
    min-width: 0;
    width: 100%;
  }

  .desk {
    display: contents;
  }

  .enquiry {
    order: 1;
  }

  .catalogue {
    order: 2;
    padding: var(--s3);
  }

  .reader {
    order: 3;
    position: static;
    max-height: none;
    overflow: visible;
  }

  .ledger {
    order: 4;
  }

  .notebook {
    order: 5;
  }

  .sheet {
    padding: var(--s4);
    min-height: 0;
    overflow-wrap: anywhere;
  }

  .sheetmeta {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    row-gap: var(--s2);
  }

  .sheetmeta > div:nth-child(2n) {
    border-right: 0;
  }

  /* The results table becomes one card per question. */
  #tally,
  #tally tbody,
  #tally tr,
  #tally td {
    display: block;
    width: 100%;
  }

  #tally thead {
    display: none;
  }

  #tally tr {
    padding: var(--s3) 0;
    border-bottom: 1px solid var(--rule);
  }

  #tally td {
    border: 0;
    padding: 2px 0;
  }

  #tally td[data-label]::before {
    content: attr(data-label) ' · ';
    font: var(--t1) var(--mono);
    color: var(--muted);
  }

  #tally .qcell {
    margin-bottom: var(--s2);
    max-width: none;
  }

  #tally tr.sum {
    border-top: 3px double var(--rule-strong);
    border-bottom: 0;
  }

  #tally tr.sum td {
    border: 0;
  }
}
